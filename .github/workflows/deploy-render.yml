name: Deploy To Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deploy configuration
        id: deploy_config
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Render deploy hook secret is not configured. Skipping deployment."
          fi

      - name: Set up .NET
        if: steps.deploy_config.outputs.configured == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        if: steps.deploy_config.outputs.configured == 'true'
        run: dotnet restore modisette.sln

      - name: Build solution
        if: steps.deploy_config.outputs.configured == 'true'
        run: dotnet build modisette.sln --configuration Release --no-restore

      - name: Run tests
        if: steps.deploy_config.outputs.configured == 'true'
        run: dotnet test modisette.sln --configuration Release --no-build

      - name: Trigger Render deploy hook
        if: steps.deploy_config.outputs.configured == 'true'
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"